services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memocycle_test
      POSTGRES_USER: memocycle_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memocycle_test -d memocycle_test"]
      interval: 2s
      timeout: 3s
      retries: 20

